<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Termómetro Mandato Presidencial by Starsailover </title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 20px;
  }

  .container {
    width: 300px;
    margin: 0 auto;
  }

  .silhouette-wrapper {
    position: relative;
    width: 300px;
    margin: 0 auto;
  }

  /* Truco para eliminar fondo blanco del PNG */
  .silhouette {
    width: 100%;
    display: block;
  }

  .fill-mask {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    mix-blend-mode: multiply;
    border-top: 2px solid rgba(255, 255, 255, 0.9);

    /* Degradado azul → rojo */
    background: linear-gradient(
      to bottom,
      rgba(0, 120, 255, 0.65) 0%,
      rgba(255, 0, 0, 0.65) 100%
    );

    height: 0;
    transition: height 2.5s ease-out;

    /* Recorta el relleno con la forma de la silueta */
  -webkit-mask-image: url("abelardo.png");
  mask-image: url("abelardo.png");
  -webkit-mask-size: 300px auto;
  mask-size: 300px auto;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: top;
  mask-position: top;
    
  }

  .stats {
    margin-top: 20px;
    font-size: 18px;
  }

  .headline {
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Termómetro del Mandato Presidencial</h2>

  <div class="silhouette-wrapper">
    <img src="abelardo.png" class="silhouette" id="silhouette">
    <div class="fill-mask" id="fillMask"></div>
  </div>

  <div class="headline">
    Ha pasado <span id="percentHeadline"></span>% de la presidencia de Abelardo de la Espriella
  </div>

  <div class="stats">
    <p><strong>Porcentaje cumplido:</strong> <span id="percent"></span>%</p>
    <p><strong>Días transcurridos:</strong> <span id="passed"></span> / 1461</p>
    <p><strong>Días restantes:</strong> <span id="remaining"></span></p>
  </div>
</div>

<script>
  const startDate = new Date("2026-08-07");
  const endDate = new Date("2030-08-07");
  const today = new Date();

  const totalDays = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24));
  const passedDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  const remainingDays = totalDays - passedDays;

  const percent = (passedDays / totalDays) * 100;

  document.getElementById("percent").textContent = percent.toFixed(3);
  document.getElementById("percentHeadline").textContent = percent.toFixed(3);
  document.getElementById("passed").textContent = passedDays;
  document.getElementById("remaining").textContent = remainingDays;

  const silhouette = document.getElementById("silhouette");
  const fillMask = document.getElementById("fillMask");

  silhouette.onload = () => {
    const height = silhouette.clientHeight;
    let fillHeight = height * (percent / 100);

    // Altura mínima visible
    if (fillHeight < 4) fillHeight = 4;

    setTimeout(() => {
      fillMask.style.height = fillHeight + "px";
    }, 300);
  };
</script>

</body>
</html>
